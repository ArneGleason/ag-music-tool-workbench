<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocal word timing review</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#14191d;color:#e2e8ec}body{margin:0}header{position:sticky;top:0;background:#20272c;padding:14px 24px;border-bottom:1px solid #46515a;z-index:2}h1{font-size:21px;margin:0 0 8px}audio{width:min(620px,90vw);height:35px;vertical-align:middle}label{margin-left:16px}main{max-width:1250px;padding:16px 24px;margin:auto}.phrase{border-bottom:1px solid #394149;padding:15px 0;display:grid;grid-template-columns:160px 1fr;gap:16px}button{font:inherit;background:#2b3942;color:#e6eef5;border:1px solid #53616c;border-radius:4px;padding:7px;cursor:pointer}button:hover,button:focus-visible{outline:2px solid #96d8db}.word{display:inline-flex;flex-direction:column;align-items:center;margin:3px;padding:5px 8px}.word small{font:11px ui-monospace;color:#a7b5bf}.word.flag{border-bottom:3px solid #d4a75c}.word.active{background:#73c6c9;color:#102022}.word.active small{color:#193337}.note{color:#c6b087;margin:8px 0 0;font-size:13px}.muted{color:#a3b0b8}#clock{font:16px ui-monospace;padding:8px;display:inline-block}#summary{margin:5px 0 0}.hidden{display:none}select{font:inherit;padding:5px} @media(max-width:650px){.phrase{grid-template-columns:1fr}header{padding:12px}main{padding:10px}label{display:block;margin:8px 0}}
</style>
<header><h1>Vocal word timing · first pass</h1><audio id="audio" controls preload="metadata" src="vocal.wav"></audio><span id="clock">0:00.000</span><label><input id="flagged" type="checkbox"> Review flags only</label><p id="summary" class="muted"></p></header>
<main><p class="muted">Click a phrase to play its range, or a word to hear its boundaries with a little context. Space pauses/resumes. Amber underlines indicate review flags. Wordless syllable spellings and machine timings remain provisional.</p><div id="rows"></div></main>
<script id="data" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.querySelector('#data').textContent),audio=document.querySelector('#audio');let stopAt=null;
if(data.master_preview){const select=document.createElement('select');select.setAttribute('aria-label','Audition source');for(const[value,text]of [['vocal.wav','Clean '+data.role],[data.master_preview,'Master mix']]){const option=document.createElement('option');option.value=value;option.textContent=text;select.append(option)}select.onchange=()=>{const t=audio.currentTime;const playing=!audio.paused;audio.pause();audio.src=select.value;audio.addEventListener('loadedmetadata',()=>{audio.currentTime=t;if(playing)audio.play()},{once:true});audio.load()};audio.before(select)}
document.querySelector('#summary').textContent=`${data.role} · ${data.words.length} words/syllables · ${data.words.filter(w=>w.flags.length).length} flagged · master-relative seconds`;
function playRange(start,end){audio.currentTime=Math.max(0,start-.12);stopAt=end+.18;audio.play()}
const nodes=[];for(const p of data.phrases){const row=document.createElement('section');row.className='phrase';row.dataset.flagged=!p.words.length||p.words.some(w=>w.flags.length);const left=document.createElement('div'),play=document.createElement('button');play.textContent=`${p.start.toFixed(3)}–${p.end.toFixed(3)} ▶`;play.onclick=()=>playRange(p.start,p.end);left.append(play);const id=document.createElement('div');id.className='muted';id.textContent=p.id;left.append(id);row.append(left);const right=document.createElement('div');if(!p.words.length){const event=document.createElement('p');event.textContent=p.text;right.append(event)}if(p.audible_extent_candidate){const a=p.audible_extent_candidate;const extent=document.createElement('button');extent.textContent='Audible span';extent.title=`Energy-derived reference ${a.start.toFixed(3)}–${a.end.toFixed(3)}; may include breath or tail`;extent.onclick=()=>playRange(a.start,a.end);left.append(extent)}for(const w of p.words){const b=document.createElement('button');b.className='word'+(w.flags.length?' flag':'');const t=document.createElement('span');t.textContent=w.text;const tm=document.createElement('small');tm.textContent=w.start===null?'unaligned':`${w.start.toFixed(3)}–${w.end.toFixed(3)}`;b.append(t,tm);b.title=w.flags.join(', ')||'Machine aligned; not listening verified';b.disabled=w.start===null;b.onclick=()=>playRange(w.start,w.end);right.append(b);nodes.push([w,b])}if(p.note){const n=document.createElement('p');n.className='note';n.textContent=p.note;right.append(n)}row.append(right);document.querySelector('#rows').append(row)}
document.querySelector('#flagged').onchange=e=>document.querySelectorAll('.phrase').forEach(r=>r.classList.toggle('hidden',e.target.checked&&r.dataset.flagged!=='true'));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!e.target.isContentEditable){e.preventDefault();if(audio.paused){stopAt=null;audio.play()}else audio.pause()}});
let lastPaint=0;function update(now=0){if(now-lastPaint<50){requestAnimationFrame(update);return}lastPaint=now;const t=audio.currentTime;document.querySelector('#clock').textContent=`${Math.floor(t/60)}:${(t%60).toFixed(3).padStart(6,'0')}`;for(const[w,n]of nodes){const active=w.start!==null&&t>=w.start&&t<w.end;if(n.classList.contains('active')!==active)n.classList.toggle('active',active)}if(stopAt!==null&&t>=stopAt){audio.pause();stopAt=null}requestAnimationFrame(update)}update();
</script></html>
